# gitleaks config — uses the full default ruleset, plus an allowlist for the
# handful of values that are PUBLIC by design (they ship in the browser bundle
# anyway). Real secrets (CLIENT_SECRET, storage keys, the Turnstile *secret*
# key) are never committed — they live only in Azure + git-ignored local files.

[extend]
useDefault = true

[allowlist]
description = "Placeholder example files"
paths = [
  '''\.env\.example$''',
  '''\.env\.production\.example$''',
  '''api/local\.settings\.json\.example$''',
]
