name: CI

# Guardrails before anything reaches `main` (which Cloudflare auto-deploys):
#  - secret-scan : block commits that contain real secrets/keys
#  - website     : type-check + lint + the production build must succeed
#  - api         : the Azure Function must parse + its deps install
# Make secret-scan and website "required status checks" in branch protection
# so a failing check blocks the merge (see docs/CI.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so a secret in ANY commit is caught
      - name: Scan repo + history for secrets
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Production build must succeed
        run: npm run build
      - name: Dependency audit (informational)
        run: npm audit --audit-level=high || true

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API deps
        run: npm ci
        working-directory: api
      - name: Syntax-check the function
        working-directory: api
        run: |
          node --check src/functions/volunteerAgreement.js
          node --check src/lib/graph.js
          node --check src/lib/turnstile.js
      - name: API dependency audit (informational)
        run: npm audit --audit-level=high || true
        working-directory: api
